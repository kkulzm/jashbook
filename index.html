<style>

.up{color:#b3261e}.dn{color:#0b3d91}

.ci{color:var(--inc)}.cx{color:var(--exp)}.nz{color:var(--inc);font-weight:700}
.link{border:0;background:none;color:var(--acc);font:inherit;font-weight:500;cursor:pointer;padding:12px 0}
.ce,.ca{display:flex;gap:8px;margin-bottom:8px}
.ce input,.ca input{flex:1;min-width:0}
.ce button{width:46px;height:46px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:12px;cursor:pointer;font-size:16px}

h2{font-weight:600}

.balance{margin-top:0}

.ci{color:var(--ci)}.cx{color:var(--cx)}

      <div class="w"><label for="pw">비밀번호 (6자 이상)</label><input type="password" id="pw" autocomplete="current-password"></div>
    </div>

    var ws=sheetOf(aoa,[10,18,11,11,11,11,11,11,11,11,11,11,11,11,11]);
    boxed(ws,0,aoa.length-1,0,14,0,NUMZ);bold.forEach(function(r){boldRow(ws,r,0,14)});
    for(var r=1;r<aoa.length;r++){
      var cell=ws[XLSX.utils.encode_cell({r:r,c:14})],v=aoa[r][14];
      if(!cell)continue;
      var ft={bold:bold.indexOf(r)>-1};
      if(typeof v==="number"){if(v>0)ft.color={rgb:"B3261E"};else if(v<0)ft.color={rgb:"0B3D91"};cell.z="+0.0%;-0.0%;0.0%"}
      cell.s={border:BORD,alignment:{horizontal:"right"},font:ft};
    }
    dl.forEach(function(d,j){
      var c=ws[XLSX.utils.encode_cell({r:aoa.length-1,c:2+j})];if(!c)return;
      var ft={};
      if(typeof d==="number"){if(d>0)ft.color={rgb:"B3261E"};else if(d<0)ft.color={rgb:"0B3D91"};c.z="+#,##0;-#,##0;0"}
      c.s={border:BORD,alignment:{horizontal:"right"},font:ft};
    });
    return ws;
  }
  $("xl").addEventListener("click",function(){
    if(!window.XLSX){alert("엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.");return}
    var y=String(ym.y),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,yearSheet("i",y),"연간 수입");
    XLSX.utils.book_append_sheet(wb,yearSheet("e",y),"연간 지출");
    XLSX.utils.book_append_sheet(wb,assetSheet(y),"연간 자산");
    for(var m=1;m<=12;m++){
      var p=y+"-"+pad(m),inc=0,exp=0;
      var list=tx.filter(function(t){return t.date.indexOf(p)===0}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
      var aoa=[["날짜","구분","카테고리","사용처","메모","지출 수단","금액"]];
      list.forEach(function(t){
        if(t.type==="i")inc+=t.amount;else exp+=t.amount;
        aoa.push([t.date,t.type==="i"?"수입":"지출",t.cat,t.place,t.memo,t.type==="e"?t.method:"",t.amount]);
      });
      var n=list.length;
      aoa.push([]);
      aoa.push(["","","","","","수입 합계",inc]);
      aoa.push(["","","","","","지출 합계",exp]);
      aoa.push(["","","","","","잔액",inc-exp]);
      var ws=sheetOf(aoa,[12,7,14,18,22,12,14]);
      boxed(ws,0,n,0,6,0,NUM);
      boxed(ws,n+2,n+4,5,6,-1,NUM);boldRow(ws,n+2,5,5);boldRow(ws,n+3,5,5);boldRow(ws,n+4,5,5);
      XLSX.utils.book_append_sheet(wb,ws,m+"월");
    }
    XLSX.writeFile(wb,"JASHBOOK_"+y+".xlsx");
  });

  var FILT={c:[],m:[]};
  function passF(t){
    if(FILT.c.length&&FILT.c.indexOf(t.cat)<0)return false;
    if(FILT.m.length){if(t.type!=="e")return false;if(FILT.m.indexOf(t.method||"미지정")<0)return false}
    return true;
  }
  function chips(id,list,sel){
    $(id).innerHTML=list.map(function(v){return '<label class="chip"><input type="checkbox" value="'+qa(v)+'"'+(sel.indexOf(v)>-1?" checked":"")+'><span>'+esc(v)+"</span></label>"}).join("");
  }
  function readChips(id){return [].slice.call($(id).querySelectorAll("input:checked")).map(function(i){return i.value})}
  $("fbtn").addEventListener("click",function(){
    chips("fce",CATS.e,FILT.c);chips("fci",CATS.i,FILT.c);chips("fcm",CATS.m.concat(["미지정"]),FILT.m);
    $("fmodal").hidden=false;
  });
  $("fclose").addEventListener("click",function(){$("fmodal").hidden=true});
  $("fmodal").addEventListener("click",function(e){if(e.target===this)this.hidden=true});
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape")return;
    if(!$("fmodal").hidden)$("fmodal").hidden=true;
    else if(!$("emodal").hidden)endEdit();
    else if(!$("amodal").hidden)$("amodal").hidden=true;
    else if(!$("bmodal").hidden)closeBudget();
    else if(!$("acmodal").hidden)closeAcc();
  });
  $("freset").addEventListener("click",function(){[].slice.call($("fmodal").querySelectorAll("input")).forEach(function(i){i.checked=false})});
  $("fapply").addEventListener("click",function(){
    var c=readChips("fce").concat(readChips("fci")).filter(function(v,i,a){return a.indexOf(v)===i});
    FILT={c:c,m:readChips("fcm")};
    $("fmodal").hidden=true;renderC();
  });
  var uemail="";
  function accView(v){$("acA").hidden=v!=="A";$("acB").hidden=v!=="B";$("actit").textContent=v==="A"?"계정 설정":"계정 삭제"}
  function openAcc(){
    ["cpw","npw1","npw2","dpw"].forEach(function(id){$(id).value=""});
    ["cperr","cpok","derr"].forEach(function(id){$(id).textContent=""});
    accView("A");$("acmodal").hidden=false;
  }
  function closeAcc(){$("acmodal").hidden=true}
  $("accbtn").addEventListener("click",openAcc);
  $("acclose").addEventListener("click",closeAcc);
  $("acmodal").addEventListener("click",function(e){if(e.target===this)closeAcc()});
  $("acdel").addEventListener("click",function(){$("derr").textContent="";$("dpw").value="";accView("B")});
  $("dcancel").addEventListener("click",function(){accView("A")});
  $("cpgo").addEventListener("click",async function(){
    var cur=$("cpw").value,n1=$("npw1").value,n2=$("npw2").value;
    $("cpok").textContent="";
    if(!cur){$("cperr").textContent="현재 비밀번호를 입력해 주세요.";return}
    if(n1.length<6){$("cperr").textContent="새 비밀번호는 6자 이상이어야 해요.";return}
    if(n1!==n2){$("cperr").textContent="새 비밀번호가 서로 달라요.";return}
    if(n1===cur){$("cperr").textContent="현재 비밀번호와 다른 비밀번호를 입력해 주세요.";return}
    $("cperr").textContent="";$("cpgo").disabled=true;
    var v=await sb.auth.signInWithPassword({email:uemail,password:cur});
    if(v.error){$("cpgo").disabled=false;$("cperr").textContent="현재 비밀번호가 맞지 않아요.";return}
    var r=await sb.auth.updateUser({password:n1});
    $("cpgo").disabled=false;
    if(r.error){$("cperr").textContent="비밀번호를 바꾸지 못했어요. ("+r.error.message+")";return}
    ["cpw","npw1","npw2"].forEach(function(id){$(id).value=""});
    $("cpok").textContent="비밀번호가 변경되었어요.";
  });
  $("dgo").addEventListener("click",async function(){
    var pw=$("dpw").value;
    if(!pw){$("derr").textContent="비밀번호를 입력해 주세요.";return}
    $("derr").textContent="";$("dgo").disabled=true;
    var v=await sb.auth.signInWithPassword({email:uemail,password:pw});
    if(v.error){$("dgo").disabled=false;$("derr").textContent="비밀번호가 맞지 않아요.";return}
    var r=await sb.rpc("delete_my_account");
    $("dgo").disabled=false;
    if(r.error){$("derr").textContent="계정을 삭제하지 못했어요. ("+r.error.message+")";return}
    try{await sb.auth.signOut()}catch(e){}
    try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("sb-")===0)localStorage.removeItem(k)})}catch(e){}
    tx=[];REC=[];AST=[];uid=null;uemail="";
    closeAcc();show(false);$("em").value="";$("pw").value="";$("aerr").textContent="계정이 삭제되었어요.";
  });

  async function start(user){uid=user.id;uemail=user.email||"";show(true);showPage("rec");$("pw").value="";await loadAll()}

  async function auth(mode){
    var email=$("em").value.trim(),pw=$("pw").value;
    if(!email||pw.length<6){$("aerr").textContent="이메일과 6자 이상의 비밀번호를 입력해 주세요.";return}
    $("aerr").textContent="";
    var r=mode==="up"?await sb.auth.signUp({email:email,password:pw}):await sb.auth.signInWithPassword({email:email,password:pw});
    if(r.error){$("aerr").textContent=mode==="up"?"가입하지 못했어요: "+r.error.message:"로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.";return}
    if(r.data.session)start(r.data.user);
    else $("aerr").textContent="가입 완료! 메일로 온 인증 링크를 누른 뒤 로그인해 주세요.";
  }
  $("signin").addEventListener("click",function(){auth("in")});
  $("signup").addEventListener("click",function(){auth("up")});
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")auth("in")});
  $("out").addEventListener("click",async function(){await sb.auth.signOut();tx=[];uid=null;show(false)});

  var now=new Date();ym={y:now.getFullYear(),m:now.getMonth()+1};
  $("date").value=today();selDay=today();
  fillCats();
  sb.auth.getSession().then(function(r){var s=r.data.session;if(s)start(s.user);else show(false)});
})();
</script>
